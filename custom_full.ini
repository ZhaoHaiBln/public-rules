ruleset=▶️ YouTube,[]DOMAIN,youtubeembeddedplayer.googleapis.com
ruleset=🛍️ Google Play,[]DOMAIN,play.google.com
ruleset=🛍️ Google Play,[]DOMAIN,android.clients.google.com
ruleset=🛍️ Google Play,[]DOMAIN,android.apis.google.com
ruleset=🛍️ Google Play,[]DOMAIN,play-fe.googleapis.com
ruleset=🛍️ Google Play,[]DOMAIN,play.googleapis.com
ruleset=🛍️ Google Play,[]DOMAIN,pay.google.com
ruleset=🛍️ Google Play,[]DOMAIN,payments.google.com
ruleset=🛍️ Google Play,[]DOMAIN,wallet.google.com
; Google 官方 Android 网络要求中的共用 API/CDN，避免遗漏到通用代理组。
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,googleapis.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,googleusercontent.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,gstatic.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,gvt1.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,gvt2.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,gvt3.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,ggpht.com
ruleset=🌐 Google服务,[]DOMAIN-SUFFIX,ggpht.cn
ruleset=🌐 Google服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list

; 6. 国内综合集合和兜底；明确国外服务已在上面保护。
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,cn
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list

; 7. 可选广告拦截（默认 DIRECT，先保证业务可用）与国外通用集合。
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🌍 国外信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🐟 国内漏网,[]GEOIP,CN
ruleset=🐟 国外漏网,[]FINAL

