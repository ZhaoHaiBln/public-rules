[custom]
; ============================================================
; 0. 基础过滤：清洗提示性占位节点
; ============================================================
exclude_remarks=(剩余|到期|重置|官网|流量|时间|Expire|Reset|Traffic|群|通知|距离|下次|GB|MB|KB|天|说明|公告|客服)

; ============================================================
; 1. 分流业务组（完全按指定顺序排列）
; ============================================================

; 1. 国内直连
custom_proxy_group=🎯 国内直连`select`[]DIRECT`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png

; 2. 广告拦截
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]🎯 国内直连`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png

; 3. 国外信息（X、电报、Google 其他）
custom_proxy_group=🌍 国外信息`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

; 4. AI平台（GPT、Gemini、Claude 等）
custom_proxy_group=🤖 AI平台`select`[]🇸🇬 新加坡-IEPL`[]🇺🇸 美国-IEPL`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png

; 5. 国际流媒体（Netflix、Disney、MAX、YouTube 等）
custom_proxy_group=🎬 国际流媒体`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

; 6. 支付服务（PayPal 等）
custom_proxy_group=💳 支付服务`select`[]🎯 国内直连`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/CreditCard.png

; 7. 国内漏网
custom_proxy_group=🐟 国内漏网`select`[]DIRECT`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

; 8. 国外漏网
custom_proxy_group=🐟 国外漏网`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

; ============================================================
; 2. 节点地区分组（保留 IEPL 与普通独立组，已修复死循环测速）
; ============================================================

; 手动选择（全节点备选）
custom_proxy_group=🚀 手动选择`select`.*`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png

; 新加坡组
custom_proxy_group=🇸🇬 新加坡-IEPL`url-test`(?i)(新加坡|狮城|SG|Singapore).*(IEPL)`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
custom_proxy_group=🇸🇬 新加坡地区`url-test`(?i)(新加坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

; 香港组
custom_proxy_group=🇭🇰 香港-IEPL`url-test`(?i)(香港|HK|Hong Kong).*(IEPL)`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
custom_proxy_group=🇭🇰 香港地区`url-test`(?i)(香港|HK|Hong Kong)`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

; 美国组
custom_proxy_group=🇺🇸 美国-IEPL`url-test`(?i)(美国|美|US|United States).*(IEPL)`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
custom_proxy_group=🇺🇸 美国地区`url-test`(?i)(美国|美|US|United States)`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

; 其他地区组（手动选择）
custom_proxy_group=🌐 其他地区`select`(?i)(日本|JP|台湾|TW|韩国|KR|英国|UK|德国|DE|法|俄|加拿大|澳洲)`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png

; ============================================================
; 3. 分流规则金字塔（完整保留你的自建媒体规则）
; ============================================================

; 局域网直连
ruleset=🎯 国内直连,[]GEOIP,LAN
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/domestic.list

; 1. 广告拦截
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/reject.list

; 2. 支付服务
ruleset=💳 支付服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list

; 3. AI平台
ruleset=🤖 AI平台,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/ai.list
ruleset=🤖 AI平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 AI平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

; 4. 国际流媒体（已保留你的自建 media.list 规则放首位优先匹配）
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/media.list
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list

; 5. 国外信息
ruleset=🌍 国外信息,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/foreign.list
ruleset=🌍 国外信息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=🌍 国外信息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list

; 6. 国内直连
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,cn
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/China/China.list

; 7. 漏网之鱼与 IP 兜底
ruleset=🐟 国内漏网,[]GEOIP,CN
ruleset=🐟 国外漏网,[]FINAL
