[custom]
enable_rule_generator=true
overwrite_original_rules=true

; Stash / 塔台重建版：使用成熟规则源，Google 全链路共用一个出口。
; 首选地区沿用用户偏好；不将测速图标 URL 混入组定义。
; REJECT 为无匹配节点时的关闭策略，不是混入非 IEPL 节点。

custom_proxy_group=🎯 国内直连`select`[]DIRECT`[]🚀 手动选择
custom_proxy_group=🌍 国外信息`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🌐 Google服务`select`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🛍️ Google Play`select`[]🌐 Google服务
custom_proxy_group=▶️ YouTube`select`[]🌐 Google服务
custom_proxy_group=✈️ Telegram`select`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🤖 AI平台`select`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=📺 Netflix`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🏰 Disney+`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🎞 PrimeVideo`select`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🎥 Max`select`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=🎬 Emby`select`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择
custom_proxy_group=💳 PayPal`select`[]🇺🇸 美国-IEPL`[]🎯 国内直连`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国地区`[]🚀 手动选择
custom_proxy_group=🛑 广告拦截`select`[]DIRECT`[]REJECT
custom_proxy_group=🐟 国内漏网`select`[]DIRECT`[]🚀 手动选择
custom_proxy_group=🐟 国外漏网`select`[]🌍 国外信息`[]🚀 手动选择
custom_proxy_group=🚀 手动选择`select`.*`[]REJECT

; 地区与 IEPL 标记用独立条件，支持 IEPL 出现在地区名之前。
custom_proxy_group=🇸🇬 新加坡-IEPL`url-test`(?i)^(?=.*(?:新加坡|狮城|Singapore|(?<![A-Za-z])SG(?![A-Za-z])))(?=.*IEPL).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇸🇬 新加坡地区`url-test`(?i)^(?=.*(?:新加坡|狮城|Singapore|(?<![A-Za-z])SG(?![A-Za-z]))).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇭🇰 香港-IEPL`url-test`(?i)^(?=.*(?:香港|Hong[ -]?Kong|(?<![A-Za-z])HK(?![A-Za-z])))(?=.*IEPL).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇭🇰 香港地区`url-test`(?i)^(?=.*(?:香港|Hong[ -]?Kong|(?<![A-Za-z])HK(?![A-Za-z]))).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇺🇸 美国-IEPL`url-test`(?i)^(?=.*(?:美国|美國|United[ -]?States|(?<![A-Za-z])US(?![A-Za-z])))(?=.*IEPL).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇺🇸 美国地区`url-test`(?i)^(?=.*(?:美国|美國|United[ -]?States|(?<![A-Za-z])US(?![A-Za-z]))).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🌐 其他地区`select`(?i)(日本|台湾|韓國|韩国|英国|德国|法国|加拿大|澳大利亚|Japan|Taiwan|Korea|United Kingdom|Germany|France|Canada|Australia|(?<![A-Za-z])(JP|TW|KR|UK|DE|FR|CA|AU)(?![A-Za-z]))`[]REJECT

; 1. 私网和本地域名。不要把 Fake IP 的 198.18.0.0/16 当作直连网段。
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,localhost
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,local
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,lan
ruleset=🎯 国内直连,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR6,::1/128,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=🎯 国内直连,[]IP-CIDR6,fe80::/10,no-resolve

; 2. 国内业务的少量明确补充；不导入整个 ByteDance 海外业务。
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,changdunovel.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fqnovel.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fqnovelim.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fqnovelpic.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fqnovelstatic.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fqnovelvod.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fanqiesdk.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fanqiesdkpic.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fanqiesdkstatic.com
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,fanqiesdkvod.com
ruleset=🎯 国内直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/JingDong/JingDong.list

; 3. 明确 AI 服务优先。Gemini 只列业务域名，不使用 apis.google.com 共用后缀。
ruleset=🤖 AI平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🤖 AI平台,[]DOMAIN,gemini.google.com
ruleset=🤖 AI平台,[]DOMAIN,bard.google.com
ruleset=🤖 AI平台,[]DOMAIN,ai.google.dev
ruleset=🤖 AI平台,[]DOMAIN,makersuite.google.com
ruleset=🤖 AI平台,[]DOMAIN,alkalimakersuite-pa.clients6.google.com
ruleset=🤖 AI平台,[]DOMAIN,generativelanguage.googleapis.com
ruleset=🤖 AI平台,[]DOMAIN,proactivebackend-pa.googleapis.com
ruleset=🤖 AI平台,[]DOMAIN-SUFFIX,huggingface.co
ruleset=🤖 AI平台,[]DOMAIN-SUFFIX,deepseek.com

; 4. Telegram、PayPal、独立流媒体；保持用户的地区偏好。
ruleset=✈️ Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=💳 PayPal,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list
ruleset=📺 Netflix,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🏰 Disney+,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=🎞 PrimeVideo,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AmazonPrimeVideo/AmazonPrimeVideo.list
ruleset=🎥 Max,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
ruleset=🎬 Emby,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Emby/Emby.list

; 5. YouTube 核心域名与完整 Google 集合共用 Google服务 的实际出口。
ruleset=▶️ YouTube,[]DOMAIN-SUFFIX,youtube.com
ruleset=▶️ YouTube,[]DOMAIN-SUFFIX,youtu.be
ruleset=▶️ YouTube,[]DOMAIN-SUFFIX,youtube-nocookie.com
