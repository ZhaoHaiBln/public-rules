; ============================================================
; 地区自动测速
;
; 重要：
; 这里故意不添加最后的图标 URL。
; 避免塔台将图标 URL 解析成 url-test 的测速地址。
;
; 900 = 15分钟重新检测
; 100 = 100ms 容差
; ============================================================

; ---------------- 新加坡 ----------------

custom_proxy_group=🇸🇬 新加坡-IEPL`url-test`(?i)(新加坡|狮城|SG|Singapore).*(IEPL|专线)`http://www.gstatic.com/generate_204`900,,100

custom_proxy_group=🇸🇬 新加坡地区`url-test`(?i)(新加坡|狮城|SG|Singapore)`http://www.gstatic.com/generate_204`900,,100

; ---------------- 香港 ----------------

custom_proxy_group=🇭🇰 香港-IEPL`url-test`(?i)(香港|HK|Hong Kong).*(IEPL|专线)`http://www.gstatic.com/generate_204`900,,100

custom_proxy_group=🇭🇰 香港地区`url-test`(?i)(香港|HK|Hong Kong)`http://www.gstatic.com/generate_204`900,,100

; ---------------- 美国 ----------------

custom_proxy_group=🇺🇸 美国-IEPL`url-test`(?i)(美国|美|US|United States).*(IEPL|专线)`http://www.gstatic.com/generate_204`900,,100

custom_proxy_group=🇺🇸 美国地区`url-test`(?i)(美国|美|US|United States)`http://www.gstatic.com/generate_204`900,,100

; ---------------- 其他地区 ----------------

custom_proxy_group=🌐 其他地区`select`(?i)(日本|JP|Japan|台湾|TW|Taiwan|韩国|KR|Korea|英国|UK|United Kingdom|德国|DE|Germany|法国|FR|France|俄罗斯|俄|RU|Russia|加拿大|CA|Canada|澳洲|澳大利亚|AU|Australia)

