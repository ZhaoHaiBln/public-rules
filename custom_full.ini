[custom]
; ============================================================
; 0. 基础过滤：清洗提示性占位节点
; ============================================================
exclude_remarks=(剩余|到期|重置|官网|流量|时间|Expire|Reset|Traffic|群|通知|距离|下次|GB|MB|KB|天|说明|公告)

; ============================================================
; 1. 分流业务组（完全按指定顺序排列）
; ============================================================

; 1. 国内直连
custom_proxy_group=🎯 国内直连`select`[]DIRECT`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png

; 2. 广告拦截
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]🎯 国内直连`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png

; 3. 国外信息（X、电报、Google 其他）
custom_proxy_group=🌍 国外信息`select`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

; 4. AI平台（GPT、Gemini 之类）
custom_proxy_group=🤖 AI平台`select`[]🇸🇬 新加坡地区`[]🇺🇸 美国地区`[]🇭🇰 香港地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png

; 5. 国际流媒体（Netflix、Disney、MAX 之类）
custom_proxy_group=🎬 国际流媒体`select`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

; 6. 支付服务（PayPal 之类）
custom_proxy_group=💳 支付服务`select`[]🎯 国内直连`[]🇺🇸 美国地区`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/CreditCard.png

; 7. 国内漏网
custom_proxy_group=🐟 国内漏网`select`[]DIRECT`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

; 8. 国外漏网
custom_proxy_group=🐟 国外漏网`select`[]🚀 手动选择`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

; ============================================================
; 2. 节点地区分组（严格区分 IEPL 专线与普通节点）
; ============================================================

; 手动选择（全节点备选，已过滤流量提示）
custom_proxy_group=🚀 手动选择`select`.*`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png

; --- 新加坡地区：严格优先 IEPL 专线，全断自动切普通 ---
custom_proxy_group=🇸🇬 新加坡地区`fallback`[]🇸🇬 新加坡-IEPL`[]🇸🇬 新加坡-普通`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
custom_proxy_group=🇸🇬 新加坡-IEPL`url-test`(?i)^(?=.*(新加坡|坡|狮城|SG|Singapore))(?=.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
custom_proxy_group=🇸🇬 新加坡-普通`url-test`(?i)^(?=.*(新加坡|坡|狮城|SG|Singapore))(?!.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

; --- 香港地区：严格优先 IEPL 专线，全断自动切普通 ---
custom_proxy_group=🇭🇰 香港地区`fallback`[]🇭🇰 香港-IEPL`[]🇭🇰 香港-普通`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
custom_proxy_group=🇭🇰 香港-IEPL`url-test`(?i)^(?=.*(香港|港|HK|Hong Kong))(?=.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
custom_proxy_group=🇭🇰 香港-普通`url-test`(?i)^(?=.*(香港|港|HK|Hong Kong))(?!.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

; --- 美国地区：严格优先 IEPL 专线，全断自动切普通 ---
custom_proxy_group=🇺🇸 美国地区`fallback`[]🇺🇸 美国-IEPL`[]🇺🇸 美国-普通`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
custom_proxy_group=🇺🇸 美国-IEPL`url-test`(?i)^(?=.*(美国|美|US|United States))(?=.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
custom_proxy_group=🇺🇸 美国-普通`url-test`(?i)^(?=.*(美国|美|US|United States))(?!.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

; --- 其他地区：手动选择，嵌套容灾优选 ---
custom_proxy_group=🌐 其他地区`select`[]🌐 其他-容灾优选`(?i).*(日本|JP|台湾|TW|韩国|KR|英国|UK|德国|DE|法|俄|加拿大|澳洲).*`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png
custom_proxy_group=🌐 其他-容灾优选`fallback`[]🌐 其他-IEPL`[]🌐 其他-普通`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png
custom_proxy_group=🌐 其他-IEPL`url-test`(?i)^(?=.*(日本|JP|台湾|TW|韩国|KR|英国|UK|德国|DE))(?=.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png
custom_proxy_group=🌐 其他-普通`url-test`(?i)^(?=.*(日本|JP|台湾|TW|韩国|KR|英国|UK|德国|DE))(?!.*IEPL).*$`http://www.gstatic.com/generate_204`300,,50`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png

