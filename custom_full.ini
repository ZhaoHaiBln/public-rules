custom_proxy_group=🇭🇰 香港 · Flower_Trojan`url-test`(?i)^(?=.*(?:香港|Hong[ -]?Kong|(?<![A-Za-z])(?:HK|HKG)(?![A-Za-z])))(?=.*(?<![A-Za-z0-9_-])Flower_Trojan(?![A-Za-z0-9_-])).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇭🇰 香港 · liangxin`url-test`(?i)^(?=.*(?:香港|Hong[ -]?Kong|(?<![A-Za-z])(?:HK|HKG)(?![A-Za-z])))(?=.*(?<![A-Za-z0-9_-])liangxin(?![A-Za-z0-9_-])).*$`[]REJECT`https://www.gstatic.com/generate_204`900,,100
custom_proxy_group=🇸🇬 新加坡`select`[]🇸🇬 新加坡 · api-linkcube`[]🇸🇬 新加坡 · Flower_Trojan`[]🇸🇬 新加坡 · liangxin`[]🚀 手动选择
