[custom]

; ============================================================
; 0. 基础过滤：清洗提示性占位节点
; ============================================================

exclude_remarks=(剩余|到期|重置|官网|流量|时间|Expire|Reset|Traffic|群|通知|距离|下次|GB|MB|KB|天|说明|公告|客服)


; ============================================================
; 1. 业务分流组
; ============================================================

; 1. 国内直连
custom_proxy_group=🎯 国内直连`select`[]DIRECT`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png

; 2. 广告拦截
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]🎯 国内直连`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png

; 3. 国外信息
; Google / GitHub / X / 普通国外网站
custom_proxy_group=🌍 国外信息`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

; 4. Telegram
custom_proxy_group=✈️ Telegram`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png

; 5. AI 平台
; ChatGPT / Claude / Gemini 等
custom_proxy_group=🤖 AI平台`select`[]🇸🇬 新加坡-IEPL`[]🇺🇸 美国-IEPL`[]🇭🇰 香港-IEPL`[]🇸🇬 新加坡地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png


; ============================================================
; 2. 独立流媒体
; ============================================================

; YouTube
custom_proxy_group=▶️ YouTube`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png

; Netflix
custom_proxy_group=📺 Netflix`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png

; Disney+
custom_proxy_group=🏰 Disney+`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney.png

; Prime Video
custom_proxy_group=🎞 PrimeVideo`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Amazon.png

; Max / HBO Max
custom_proxy_group=🎥 Max`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HBO.png

; Emby
custom_proxy_group=🎬 Emby`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png


; ============================================================
; 3. PayPal
; ============================================================

custom_proxy_group=💳 PayPal`select`[]🎯 国内直连`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/CreditCard.png


; ============================================================
; 4. 漏网之鱼
; ============================================================

custom_proxy_group=🐟 国内漏网`select`[]DIRECT`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

custom_proxy_group=🐟 国外漏网`select`[]🇸🇬 新加坡-IEPL`[]🇭🇰 香港-IEPL`[]🇺🇸 美国-IEPL`[]🇸🇬 新加坡地区`[]🇭🇰 香港地区`[]🇺🇸 美国地区`[]🌐 其他地区`[]🚀 手动选择`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png


; ============================================================
; 5. 节点地区分组
; ============================================================

; ------------------------------------------------------------
; 手动选择：全部节点
; ------------------------------------------------------------

custom_proxy_group=🚀 手动选择`select`.*`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png


; ------------------------------------------------------------
; 新加坡
;
; IEPL / 专线 与普通节点分开
; 900 秒测速一次
; 100ms 容差，避免节点频繁切换
; ------------------------------------------------------------

custom_proxy_group=🇸🇬 新加坡-IEPL`url-test`(?i)(?=.*(新加坡|狮城|SG|Singapore))(?=.*(IEPL|专线)).*`http://www.gstatic.com/generate_204`900,,100`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

custom_proxy_group=🇸🇬 新加坡地区`url-test`(?i)^(?!.*(IEPL|专线)).*(新加坡|狮城|SG|Singapore).*`http://www.gstatic.com/generate_204`900,,100`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png


; ------------------------------------------------------------
; 香港
; ------------------------------------------------------------

custom_proxy_group=🇭🇰 香港-IEPL`url-test`(?i)(?=.*(香港|HK|Hong Kong))(?=.*(IEPL|专线)).*`http://www.gstatic.com/generate_204`900,,100`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

custom_proxy_group=🇭🇰 香港地区`url-test`(?i)^(?!.*(IEPL|专线)).*(香港|HK|Hong Kong).*`http://www.gstatic.com/generate_204`900,,100`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png


; ------------------------------------------------------------
; 美国
; ------------------------------------------------------------

custom_proxy_group=🇺🇸 美国-IEPL`url-test`(?i)(?=.*(美国|美|US|United States))(?=.*(IEPL|专线)).*`http://www.gstatic.com/generate_204`900,,100`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

custom_proxy_group=🇺🇸 美国地区`url-test`(?i)^(?!.*(IEPL|专线)).*(美国|美|US|United States).*`http://www.gstatic.com/generate_204`900,,100`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png


; ------------------------------------------------------------
; 其他地区
;
; 日本 / 台湾 / 韩国 / 英国 / 德国 / 法国 /
; 俄罗斯 / 加拿大 / 澳洲
;
; 保持 select，不自动跨国家跳
; ------------------------------------------------------------

custom_proxy_group=🌐 其他地区`select`(?i)(日本|JP|Japan|台湾|TW|Taiwan|韩国|KR|Korea|英国|UK|United Kingdom|德国|DE|Germany|法国|France|俄|Russia|加拿大|Canada|澳洲|Australia)`https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Area.png


; ============================================================
; 6. 分流规则
;
; 顺序：
; 国内基础 → 广告 → PayPal → AI → Telegram
; → 独立流媒体 → GitHub → 自建媒体
; → 国外信息 → 国内 → FINAL
;
; 越具体越靠前
; ============================================================


; ============================================================
; 6.1 局域网 / 自建国内
; ============================================================

ruleset=🎯 国内直连,[]GEOIP,LAN

ruleset=🎯 国内直连,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/domestic.list


; ============================================================
; 6.2 广告
; ============================================================

ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/reject.list


; ============================================================
; 6.3 PayPal
; ============================================================

ruleset=💳 PayPal,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list


; ============================================================
; 6.4 AI
; ChatGPT / OpenAI / Claude / Gemini
; ============================================================

; 自建 AI 规则优先
ruleset=🤖 AI平台,https://raw.githubusercontent.com/ZhaoHaiBln/public-rules/main/ai.list

; OpenAI / ChatGPT
ruleset=🤖 AI平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list

; Claude
ruleset=🤖 AI平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list

; Gemini
ruleset=🤖 AI平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list


; ============================================================
; 6.5 Telegram
;
; 必须位于 foreign.list 前
; 否则可能提前命中「国外信息」
