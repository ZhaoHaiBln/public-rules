; 三机场按截图中的节点名称标记识别，不按协议或 IEPL 筛选。
; 地区入口机场顺序：api-linkcube、Flower_Trojan、liangxin。
custom_proxy_group=🇭🇰 香港`select`[]🇭🇰 香港 · api-linkcube`[]🇭🇰 香港 · Flower_Trojan`[]🇭🇰 香港 · liangxin`[]🚀 手动选择
